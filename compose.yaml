services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: local-research
      POSTGRES_DB: research
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - research-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  research-postgres:
